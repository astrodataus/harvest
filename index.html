<style>
/* Taliesin, Pacific Coast at dusk in autumn. Every token is a material of the coast; the season and weather move the light. */
:root{
  --abyss:#0E1117; --basalt-sea:#1B1F26; --slate:#2A2E35; --driftwood:#7B7062; --anemone:#C4724F; --spindrift:#EDF0F2;
  --kelp:#2D7A6E; --urchin:#B84A3C; --abalone:#8A7D5A; --foam:#FAFBFC; --tideline:#8A8D92; --mussel:#4A4D56; --char:#2A2520;
  --fog:#E8EAED; --salt:#F4F5F7; --ember:#ac4538;
  /* derived: the marine layer is fog over basalt; its opacity follows the light of the frame underneath */
  --marine-layer:rgba(14,17,23,var(--layer-a,.58)); --marine-edge:rgba(237,240,242,.14); --marine-line:rgba(237,240,242,.22);
  --kelp-lit:#4FB3A2; --anemone-lit:#E3976F; --urchin-lit:#E0705E;
  --font-outfit:'Outfit',system-ui,sans-serif; --font-dm-mono:'DM Mono',ui-monospace,monospace;
  --motion-fast:120ms; --motion-base:200ms; --motion-slow:350ms;
  --ease-standard:cubic-bezier(0.34,1.56,0.64,1); --ease-enter:cubic-bezier(0.34,1.4,0.64,1); --ease-exit:cubic-bezier(0.4,0,1,1);
  --land-ease:cubic-bezier(.45,.05,.25,1);
  --glow:rgba(196,114,79,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--abyss);color:var(--spindrift);font-family:var(--font-outfit);font-weight:300;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:var(--font-dm-mono);font-weight:400}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--abyss)}
.mapbox{position:absolute;inset:0;overflow:hidden}
#land{position:absolute;inset:0;width:100%;height:100%;display:block;transition:filter .9s var(--land-ease)}
.welcoming #land{filter:blur(3px) saturate(.85) brightness(.9)}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#overlay .blk{pointer-events:auto;cursor:pointer}
#intro{display:none}

/* the marine layer: glass panels over the land */
.glass{background:var(--marine-layer);-webkit-backdrop-filter:blur(18px) saturate(1.15);backdrop-filter:blur(18px) saturate(1.15);border:1px solid var(--marine-edge);border-radius:2px}

/* mast */
.mast{position:absolute;left:32px;right:32px;top:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;z-index:6;pointer-events:none}
.mast>*{pointer-events:auto}
.mark{display:flex;align-items:baseline;gap:14px}
.mark .estate{font-size:22px;font-weight:300;letter-spacing:-.01em}
.mark .app{font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(237,240,242,.72)}
.mast .when{font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(237,240,242,.78);text-align:right;line-height:1.7}
.mast .when b{color:var(--spindrift);font-weight:500}

/* story column, over the forest */
.story{position:absolute;left:32px;top:84px;width:392px;max-height:calc(100% - 84px - 158px);overflow:auto;padding:22px 24px 20px;z-index:5;scrollbar-width:none}
.story::-webkit-scrollbar{display:none}
.eyebrow{font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--anemone-lit)}
.story h1{font-weight:200;font-size:35px;line-height:1.06;letter-spacing:-.02em;margin:10px 0 14px}
.story .lede{font-size:15.5px;line-height:1.6;color:rgba(237,240,242,.86);margin:0 0 16px}
.story .lede b{font-weight:500;color:var(--spindrift)}
.stakes{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--marine-line);border-bottom:1px solid var(--marine-line);margin:0 -24px;padding:0 24px}
.stakes>div{padding:11px 0 10px}
.stakes>div+div{padding-left:12px;border-left:1px solid var(--marine-line)}
.stakes.top{margin:14px -24px 12px}
.datestrip{margin:-6px -24px 12px;padding:10px 24px 0;background:rgba(227,151,111,.08);border-bottom:1px solid rgba(227,151,111,.35)}
.datestrip .dl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--anemone-lit)}
.datestrip .dl .link{font-family:var(--font-outfit);font-size:12px;letter-spacing:0;text-transform:none}
.datestrip .stakes{margin:6px -24px 0;border-top:1px solid rgba(227,151,111,.25);border-bottom:0}
.story.offdate .stakes.top,.story.offdate .lede.short,.story.offdate .more{opacity:.45}
.board.offdate>*:not(.boardstrip){opacity:.5}
.boardstrip{margin:-16px -18px 10px;padding:7px 18px;font-size:12px;color:var(--anemone-lit);background:rgba(227,151,111,.08);border-bottom:1px solid rgba(227,151,111,.35)}
.lede.short{font-size:14.5px;line-height:1.55;margin:0 0 6px}
.more{margin:0 0 4px} .more summary{cursor:pointer;font-size:12px;color:var(--anemone-lit);list-style:none;display:inline-flex;align-items:center;gap:6px}
.more summary::before{content:'\25B8';font-size:11px;opacity:.8} .more[open] summary::before{content:'\25BE'}
.more p{font-size:13px;line-height:1.55;color:rgba(237,240,242,.78);margin:8px 0 4px}
.stakes .n{font-family:var(--font-dm-mono);font-size:17px;font-weight:400;letter-spacing:-.01em}
.stakes .l{font-size:11.5px;color:rgba(237,240,242,.7);line-height:1.35;margin-top:3px}
.stakes .n.warm{color:var(--anemone-lit)}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 4px}
.chart-h .t{font-size:13.5px}
.chart-h .t b{font-weight:500}
.chart-h .k{font-family:var(--font-dm-mono);font-size:11px;color:rgba(237,240,242,.72);letter-spacing:.04em}
#ripen{display:block;width:100%;height:150px;mix-blend-mode:screen;overflow:visible}
#ripen text{font-family:var(--font-dm-mono);font-size:11px;fill:rgba(237,240,242,.72)}
.story .foot{font-size:11.5px;line-height:1.5;color:rgba(237,240,242,.72);margin-top:12px}

/* the crew board */
.board{position:absolute;right:32px;top:84px;width:384px;max-height:calc(100% - 84px - 158px);overflow:auto;z-index:5;padding:16px 18px 14px;scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.board .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.board .head .t{font-size:12.5px;color:rgba(237,240,242,.78)}
.board .val{font-family:var(--font-dm-mono);font-size:25px;font-weight:300;letter-spacing:-.02em;margin-top:2px}
.board .delta{font-family:var(--font-dm-mono);font-size:12px;margin-top:2px}
.delta.up{color:var(--kelp-lit)} .delta.down{color:var(--urchin-lit)} .delta.even{color:rgba(237,240,242,.72)}
.actions{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px;margin-top:8px}
.btn{font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 6px;white-space:nowrap;border-radius:2px;border:1px solid var(--marine-line);transition:box-shadow var(--motion-base) var(--land-ease),background var(--motion-base) var(--land-ease),border-color var(--motion-base)}
.btn:hover{border-color:rgba(237,240,242,.72)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#fff}
.btn.primary:hover{box-shadow:0 0 22px var(--glow)}
.btn:focus-visible,.chip:focus-visible,.slot:focus-visible,.scrub:focus-visible{outline:2px solid var(--urchin-lit);outline-offset:2px}
.sect{font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(237,240,242,.72);margin:7px 0 2px;display:flex;justify-content:space-between}
.slot{position:relative;display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;min-height:30px;padding:2px 8px 3px;border:1px dashed transparent;border-radius:2px;transition:background var(--motion-base),border-color var(--motion-base)}
.slot+.slot{border-top:1px solid rgba(237,240,242,.08);margin-top:4px}
.slot .day{font-size:13px;line-height:1.2}
.slot .day small{display:block;font-family:var(--font-dm-mono);font-size:11px;color:rgba(237,240,242,.72);margin-top:1px}
.slot .cap{position:absolute;left:8px;right:8px;bottom:3px;height:2px;background:rgba(237,240,242,.08)}
.slot .cap i{display:block;height:100%;background:var(--tideline);transition:width var(--motion-slow) var(--land-ease)}
.slot.full .cap i{background:var(--anemone)}
.slot.over .cap i{background:var(--urchin-lit)}
.slot .chips{display:flex;flex-wrap:wrap;gap:5px;min-height:28px;align-items:center}
.slot.drop{background:rgba(196,114,79,.12);border-color:rgba(227,151,111,.6)}
.slot.nope{border-color:var(--urchin-lit);animation:nope .32s var(--ease-exit)}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.scen{display:flex;margin:6px 0 0;border:1px solid var(--marine-line);border-radius:2px;overflow:hidden}
.scen button{flex:1;display:flex;align-items:baseline;justify-content:center;gap:5px;padding:4px 4px;font-size:11.5px;color:rgba(237,240,242,.75);border-right:1px solid var(--marine-line);white-space:nowrap}
.scen button:last-child{border-right:0}
.scen button b{font-weight:400;color:inherit} .scen button small{font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.06em;opacity:.7}
.scen button.on{background:rgba(237,240,242,.1);color:var(--spindrift)} .scen button.on small{color:var(--anemone-lit);opacity:1}
.scen button:hover{background:rgba(237,240,242,.06)}
.storm.dry{border-style:solid}
.scdrawer{margin:0 0 2px;padding:8px 10px 9px;border:1px solid rgba(227,151,111,.4);border-top:0;border-radius:0 0 2px 2px;background:rgba(196,114,79,.1);animation:wag-register var(--motion-slow) var(--ease-enter) both}
.scdrawer .sdh{display:flex;align-items:baseline;gap:10px;font-size:12.5px} .scdrawer .sdh b{font-weight:500;color:var(--spindrift)}
.scdrawer .sdh .mono{font-family:var(--font-dm-mono);font-size:11px;color:var(--anemone-lit)}
.scdrawer .sdx{margin-left:auto;font-size:16px;line-height:1;color:rgba(237,240,242,.6);padding:0 2px} .scdrawer .sdx:hover{color:var(--spindrift)}
.scdrawer p{margin:4px 0 0;font-size:12px;line-height:1.5;color:rgba(237,240,242,.82)}
.scen:has(+.scdrawer){border-radius:2px 2px 0 0}
.storm{margin-top:6px}
.storm{margin:3px 0 0;padding:3px 10px;border-radius:2px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
  background:repeating-linear-gradient(105deg,rgba(138,141,146,.14) 0 2px,transparent 2px 7px);border:1px solid rgba(138,141,146,.3)}
.storm .mono{font-size:11px;color:rgba(237,240,242,.75)}
.after{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
.after .slot{grid-template-columns:1fr;gap:1px;min-height:32px;align-content:start;padding:2px 6px 3px;margin-top:0}
.after .slot .day{display:flex;justify-content:space-between;align-items:baseline}
.after .slot .day small{margin-top:0}
.after .slot+.slot{border-top:0}
.after .slot:nth-child(n+3){border-top:1px solid rgba(237,240,242,.08)}
.chip{position:relative;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 6px;border-radius:2px;background:rgba(237,240,242,.08);border:1px solid rgba(237,240,242,.16);font-size:12px;line-height:1;cursor:grab;touch-action:none;user-select:none;transition:background var(--motion-fast),border-color var(--motion-fast)}
.chip:hover,.chip.hot{background:rgba(237,240,242,.16);border-color:rgba(237,240,242,.4)}
.chip::before{content:'';position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.sg{width:12px;height:12px;flex:none}
#overlay .lab .sg{width:12px;height:12px}
.chip .t{font-family:var(--font-dm-mono);font-size:11px;color:rgba(237,240,242,.72)}
.chip.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--basalt-sea);box-shadow:0 12px 32px rgba(0,0,0,.4);cursor:grabbing}
.chip.lift{opacity:.25}
.board .note{font-size:11.5px;line-height:1.5;color:rgba(237,240,242,.72);margin-top:12px}

/* the season, a datum line wider than the content */
.season{position:absolute;left:0;right:0;bottom:0;height:142px;z-index:6;padding:0 32px 18px;display:flex;flex-direction:column;justify-content:flex-end}
.season .row{display:flex;align-items:flex-end;gap:16px}
.play{flex:none;width:38px;height:38px;margin-bottom:3px;border-radius:50%;border:1px solid var(--marine-edge);display:grid;place-items:center;background:var(--marine-layer);-webkit-backdrop-filter:blur(18px) saturate(1.15);backdrop-filter:blur(18px) saturate(1.15)}
.play:hover{border-color:rgba(237,240,242,.45)}
.play svg{width:14px;height:14px;fill:var(--spindrift);margin-left:2px}
.scrub{position:relative;flex:1;height:64px;cursor:ew-resize;touch-action:none}
.fortrow{margin-bottom:2px;align-items:stretch}
.fortpad{flex:none;width:38px}
.fort{position:relative;flex:1;height:36px;cursor:ew-resize;touch-action:none;border-bottom:1px solid rgba(237,240,242,.18);background:linear-gradient(to top,rgba(14,17,23,.5),rgba(14,17,23,.08))}
.fort .fd{position:absolute;bottom:0;width:1px;height:5px;background:rgba(237,240,242,.4)}
.fort .fn{position:absolute;bottom:7px;transform:translateX(-50%);font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.04em;color:rgba(237,240,242,.72);white-space:nowrap}
.fort .fn.pick{color:var(--spindrift)} .fort .fn.wet{color:rgba(237,240,242,.4)}
.fort .fs{position:absolute;bottom:19px;height:5px;border-radius:1px;background:rgba(237,240,242,.18)}
.fort .fs i{position:absolute;left:0;top:0;bottom:0;background:var(--anemone-lit);border-radius:1px}
.fort .fs.wet i{background:#9DB5C9}
.fort .fr{position:absolute;bottom:26px;width:7px;margin-left:-3px;background:rgba(157,181,201,.7);border-radius:1px 1px 0 0}
.fort .fp{position:absolute;bottom:30px;transform:translateX(-50%);font-family:var(--font-dm-mono);font-size:11px;color:#9DB5C9;white-space:nowrap}
.fort .fstorm{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(138,141,146,.14) 0 3px,transparent 3px 7px)}
.fort .fw{position:absolute;bottom:25px;height:6px;background:rgba(227,151,111,.28);border-left:1px solid rgba(227,151,111,.7);border-right:1px solid rgba(227,151,111,.7)}
.fort .fw span{position:absolute;left:0;bottom:100%;font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.04em;color:var(--anemone-lit);white-space:nowrap;margin-bottom:1px}
.fort .ftoday{position:absolute;top:0;bottom:0;width:1px;background:var(--anemone-lit);opacity:.8}
.fort .fknob{position:absolute;bottom:-5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--spindrift);box-shadow:0 0 0 3px rgba(237,240,242,.18)}
.fort .fev{position:absolute;bottom:17px;transform:translateX(-50%);font-size:11px;line-height:1;color:rgba(237,240,242,.75);pointer-events:auto}
.fort .fev.in{color:var(--spindrift)} .fort .fev.out{color:#C98BD6} .fort .fev.near{color:#8FD6C8;font-size:14px;bottom:14px}
.fort .fev.on{font-size:12px;bottom:16px}
.fort .fplay{position:absolute;right:0;top:-1px;display:inline-flex;align-items:center;gap:5px;padding:2px 7px;font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--anemone-lit);border:1px solid rgba(227,151,111,.4);border-radius:2px;background:rgba(14,17,23,.55)}
.fort .fplay .ico{width:11px;height:11px}
.fort .fplay:hover{border-color:var(--anemone-lit)}
.scrub .readout .ev{display:inline-block;margin-top:2px;color:rgba(237,240,242,.85)} .scrub .readout .ev.in{color:var(--spindrift)} .scrub .readout .ev.out{color:#C98BD6} .scrub .readout .ev.rain{color:#9DB5C9}
.fort .flbl{position:absolute;right:112px;top:2px;font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(237,240,242,.72)}
@media (max-width:980px){.fortrow{display:none}}
.scrub .datum{position:absolute;left:-48px;right:-48px;bottom:22px;height:1px;background:rgba(237,240,242,.55)}
.scrub .tick{position:absolute;bottom:22px;width:1px;height:6px;background:rgba(237,240,242,.55)}
.scrub .mo{position:absolute;bottom:4px;transform:translateX(-50%);font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(237,240,242,.7)}
.scrub .ph{position:absolute;bottom:32px;transform:translateX(-50%);font-size:11.5px;color:rgba(237,240,242,.8);white-space:nowrap}
.scrub .ph::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:6px;background:rgba(237,240,242,.4)}
.scrub .rain{position:absolute;bottom:23px;width:3px;background:var(--tideline);opacity:.9}
.scrub .today{position:absolute;bottom:14px;width:1px;height:46px;background:var(--anemone-lit)}
.scrub .today span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-family:var(--font-dm-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--anemone-lit);white-space:nowrap;padding-bottom:3px}
.scrub .knob{position:absolute;bottom:16px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--spindrift);box-shadow:0 0 0 4px rgba(237,240,242,.18)}
.scrub .readout{position:absolute;bottom:40px;transform:translateX(-50%);font-family:var(--font-dm-mono);font-size:11px;text-align:center;line-height:1.4;background:var(--basalt-sea);padding:4px 7px;border-radius:2px;white-space:nowrap;border:1px solid var(--marine-edge)}

// ---------- the land: frames on the season ----------

  if (STORM0 != null) KEYS.push({t: STORM0 - 0.25, f:'f4'}, {t: STORM0 + 0.6, f:'f5'}, {t: STORM1 - 0.5, f:'f5'}, {t: STORM1 + 2, f:'f4'});
  KEYS.push({t: day('2026-10-24'), f:'f6'});
}
buildKeys();
const T0 = day('2026-03-01'), T1 = day('2026-11-15');
function frameAt(t){
  if (t <= KEYS[0].t) return {a:KEYS[0].f, b:KEYS[0].f, m:0};
  for (let i = 0; i < KEYS.length-1; i++){
    const k0 = KEYS[i], k1 = KEYS[i+1];
    if (t <= k1.t){ const m = (t - k0.t)/(k1.t - k0.t); return {a:k0.f, b:k1.f, m: m*m*(3-2*m)}; }
  }

}
function stormAt(t){ // 0..1 rain intensity from the forecast, with the front arriving Thursday 2 PM
  if (STORM0 == null || t < STORM0 - 0.15 || t > STORM1 + 0.3) return 0;
  const up = clamp((t - (STORM0 - 0.15))/0.35, 0, 1), down = clamp(((STORM1 + 0.3) - t)/0.8, 0, 1);
  const f = D.forecast.find(x => Math.floor(day(x.d)) === Math.floor(t)); const r = f ? clamp(f.rain/1.0, .25, 1) : .4;
  return Math.min(up, down) * r;

// ---------- camera: the image covers the stage; a gentle push toward a chosen block ----------
const IMG = {w: 2560, h: 1429};
const cam = {x: .5, y: .5, z: 1, tx: .5, ty: .5, tz: 1};
let VW = 0, VH = 0, DPR = 1, mapEl = $('.mapbox');
function coverScale(){ return Math.max(VW/IMG.w, VH/IMG.h); }

function wide(){ return window.innerWidth > 980; }
function uiGap(){ // the free land between the story and the board, in stage pixels

  const L = st ? st.offsetLeft + st.offsetWidth + 16 : 0, R = bd ? bd.offsetLeft - 16 : VW;
